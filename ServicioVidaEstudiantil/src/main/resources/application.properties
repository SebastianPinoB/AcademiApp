spring.application.name=ServicioVidaEstudiantil 
#//nombre del microservicio, cambiar por cada microservicio

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/fs_serviciovidaestudiantil?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=system
#asimilar todas las contraseñas
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

server.port=5002 
#server port debe ser distinto por cada microservicio, cambiar otros servicios

#Swagger config
springdoc.swagger-ui.path=/servicioVidaEstudiantil.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha