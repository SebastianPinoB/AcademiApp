spring.application.name=ServicioGestionAcademica

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

spring.datasource.url=jdbc:mysql://localhost:3306/fs_serviciogestionacademica?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

server.port=5008


#Swagger config
springdoc.swagger-ui.path=/servicioGestionAcademica.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=alpha